# Dependabot（审计 A-10）：npm / Cargo / Actions 三生态周度巡检，PR 形式提交、由维护者决定是否合并
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

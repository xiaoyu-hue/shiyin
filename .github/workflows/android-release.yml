# 安卓 App 正式版构建：assembleRelease 产出 release APK。
# 签名：配置以下 Secrets 后启用正式签名。手动 dispatch 缺失时产出未签名包（仅供链路验证）；
# tag 触发的正式构建缺签名直接红灯（审计 A-64），防未签名包误入 Release。所需 Secrets：
#   ANDROID_KEYSTORE_BASE64   keystore 文件的 Base64
#   ANDROID_KEYSTORE_PASSWORD keystore 密码
#   ANDROID_KEY_ALIAS         密钥别名
#   ANDROID_KEY_PASSWORD      密钥密码
# 触发：workflow_dispatch 手动触发（合并到默认分支后可用）；
# 本分支另带 push 触发，用于在合并前验证构建链路。
name: android-release

on:
  workflow_dispatch:
  push:
    branches: [release/app-1.0]

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # 发布门禁（审计 A-06）：构建前先跑全量单测，红灯不打包
      - name: 单元测试门禁
        run: npm test

      # 版本一致性（审计 A-17）：锁文件版本必须与 package.json 一致
      - name: 版本一致性校验
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(l.version!==p.version||l.packages[''].version!==p.version){console.error('package-lock.json 版本与 package.json 不一致');process.exit(1)}"

      # 原生包内的网页资源必须用相对 base（./），GitHub Pages 用的 /shiyin/ 在 App 内会 404
      - run: npm run build:native

      - run: npx cap sync android

      - name: Restore signing keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::正式 tag 构建缺失签名 Secrets，拒绝产出未签名包（审计 A-64）"
              exit 1
            fi
            echo "未配置签名 Secrets，本次产出未签名 release 包（仅手动验证场景）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=${{ github.workspace }}/android/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "已注入正式签名配置"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 版本号把关（1.3.1 起）：APK 的 versionName/versionCode 必须与 package.json 一致，
      # 不一致直接红灯——防 build.gradle 的自动派生失效后又打出停在旧版本号的包。
      - name: 校验 APK 版本号与 package.json 一致
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJ MIN PAT <<< "$PKG_VERSION"
          EXPECTED_CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "badging: $BADGING"
          ACTUAL_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          ACTUAL_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          echo "期望 versionName=$PKG_VERSION versionCode=$EXPECTED_CODE；实际 versionName=$ACTUAL_NAME versionCode=$ACTUAL_CODE"
          if [ "$ACTUAL_NAME" != "$PKG_VERSION" ] || [ "$ACTUAL_CODE" != "$EXPECTED_CODE" ]; then
            echo "APK 版本号与 package.json 不一致，拒绝产出"
            exit 1
          fi
          echo "版本号校验通过"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shiyin-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

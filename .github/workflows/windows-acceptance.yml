name: windows-acceptance

# Windows 桌面版自动化验收门禁（1.3.0 起转正，沿用验证包的 e2e 套件）。
# 在真实 Windows runner 上完成「打包 NSIS（验收构建）→ 静默安装 → 自动化验收 → 卸载」全链，
# 产物（安装包 + 验收截图/报告 + Cargo.lock）走 artifact 下载，不发 Release。
# 验收构建与正式包的差异只有一处：Cargo feature `ci-webdriver`
#（内嵌 WebDriver 服务器）+ tauri.ci.conf.json 追加的 webdriver capability；
# 正式发布构建（windows-release.yml）两者都不启用，插件不进发布包。
# 触发：手动 dispatch；feat/windows-1.3、feat/ui-polish-1.4 合入 main 前另挂该分支 push 触发做门禁，
# 分支删除后 push 触发自然失效，main 上只用 dispatch。
on:
  workflow_dispatch:
  push:
    branches:
      - feat/windows-1.3
      - feat/ui-polish-1.4

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # 验收门禁（审计 A-06）：构建前先跑全量单测
      - name: 单元测试门禁
        run: npm test

      # 版本一致性（审计 A-17/A-18）
      - name: 版本一致性校验（锁文件）
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(l.version!==p.version||l.packages[''].version!==p.version){console.error('package-lock.json 版本与 package.json 不一致');process.exit(1)}"

      - name: 版本一致性校验（Cargo）
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($cargo -ne $pkg) { Write-Error "Cargo.toml 版本 $cargo 与 package.json $pkg 不一致"; exit 1 }
          Write-Host "版本一致性 OK: $pkg"

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master（动作代码钉死，工具链仍取 stable）
        with:
          toolchain: stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 打包 NSIS 安装包（验收构建：带 ci-webdriver feature 与 CI 能力集）
        env:
          # 验收构建标记（审计 A-09/A-65）：前端构建据此包含 CI 测试钩子与采样句柄；
          # 正式发布构建不设此变量，相关代码整段剔除
          SHIYIN_ACCEPTANCE: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis --features ci-webdriver --config src-tauri/tauri.ci.conf.json

      - name: 定位安装包
        id: inst
        shell: pwsh
        run: |
          $f = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $f) { throw 'NSIS 安装包未生成' }
          "installer=$($f.FullName)" >> $env:GITHUB_OUTPUT
          "安装包：$($f.FullName)（$($f.Length) 字节）"

      - name: 尝试启动音频服务（无声卡 runner 上尽量提供播放设备）
        shell: pwsh
        continue-on-error: true
        run: |
          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue
          Get-Service Audiosrv, AudioEndpointBuilder | Format-Table Name, Status

      - name: 生成测试音频（钩子改由 e2e 编排器在被测会话启动前写入，见 e2e/run.mjs 文件头）
        shell: python
        run: |
          import math
          import os
          import struct
          import wave

          def make_wav(path, seconds, freq, rate=22050):
              w = wave.open(path, 'wb')
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)
              frames = b''.join(
                  struct.pack('<h', int(8000 * math.sin(2 * math.pi * freq * i / rate)))
                  for i in range(int(seconds * rate))
              )
              w.writeframes(frames)
              w.close()

          test_dir = os.path.join(os.environ['RUNNER_TEMP'], 'shiyin-test')
          os.makedirs(test_dir, exist_ok=True)
          make_wav(os.path.join(test_dir, 'TestToneShort.wav'), 4, 440.0)
          make_wav(os.path.join(test_dir, 'TestToneLong.wav'), 30, 660.0)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'TEST_AUDIO_DIR={test_dir}\n')
          print('test audio dir:', test_dir)

      - name: 静默安装
        shell: pwsh
        run: |
          $p = Start-Process '${{ steps.inst.outputs.installer }}' -ArgumentList '/S' -Wait -PassThru
          "安装器退出码：$($p.ExitCode)"
          Start-Sleep -Seconds 3
          $exe = $null
          foreach ($root in @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )) {
            Get-ItemProperty $root -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'Shiyin*' } |
              ForEach-Object {
                # Tauri NSIS 写入的 InstallLocation 带引号，先剥掉再用
                $loc = $_.InstallLocation.Trim('"')
                "注册表命中：$($_.DisplayName) @ $loc"
                if ($loc -and (Test-Path $loc)) {
                  $c = Get-ChildItem $loc -Filter *.exe | Where-Object { $_.Name -ne 'uninstall.exe' } | Select-Object -First 1
                  if ($c) { $exe = $c.FullName }
                }
              }
            if ($exe) { break }
          }
          if (-not $exe) {
            # 兜底：Tauri NSIS 默认安装目录（当前用户 / 全机两种）
            foreach ($cand in @("$env:LOCALAPPDATA\Shiyin\shiyin.exe", "$env:ProgramFiles\Shiyin\shiyin.exe")) {
              if (Test-Path $cand) { $exe = $cand; break }
            }
          }
          if (-not $exe) { throw '注册表/安装目录里找不到已安装的诗音 exe' }
          "已安装 exe：$exe"
          "SHIYIN_EXE=$exe" >> $env:GITHUB_ENV
          "SHIYIN_PROC=$([IO.Path]::GetFileName($exe))" >> $env:GITHUB_ENV

      - name: 安装 pywinauto（托盘断言）
        run: pip install pywinauto psutil

      - name: 应用独立启动自检（诊断：不经 WebDriver 直接拉起；此时钩子尚未写入，不会被提前消费）
        shell: pwsh
        continue-on-error: true
        run: |
          python e2e/launch_check.py
          New-Item -ItemType Directory -Force 'e2e/artifacts' | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$pwd\e2e\artifacts\00-standalone.png")
          taskkill /IM $env:SHIYIN_PROC /F 2>$null; Start-Sleep -Seconds 2

      - name: 自动化验收（WebdriverIO + 应用内嵌 WebDriver）
        working-directory: e2e
        env:
          SHORT_NAME: TestToneShort
          LONG_NAME: TestToneLong
        run: |
          npm ci
          node run.mjs

      - name: 静默卸载
        if: always()
        shell: pwsh
        run: |
          $un = $null
          foreach ($root in @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )) {
            Get-ItemProperty $root -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'Shiyin*' } |
              ForEach-Object {
                $loc = $_.InstallLocation.Trim('"')
                if ($loc) {
                  $c = Join-Path $loc 'uninstall.exe'
                  if (Test-Path $c) { $un = $c }
                }
              }
            if ($un) { break }
          }
          if ($un) {
            $p = Start-Process $un -ArgumentList '/S' -Wait -PassThru
            "卸载器退出码：$($p.ExitCode)"
            Start-Sleep -Seconds 2
          } else {
            '未找到卸载器（可能安装未成功），跳过'
          }

      - name: 上传产物（安装包 + 验收截图与报告）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-acceptance-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            e2e/artifacts/**
          if-no-files-found: warn

      - name: 上传 Cargo.lock（回收提交入仓，保证可复现构建）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: warn

name: windows-release

# Windows 桌面版正式发布构建（1.3.0 起）。
# 与验收构建（windows-acceptance.yml）的唯一差异：不带 ci-webdriver feature、
# 不加 tauri.ci.conf.json——内嵌 WebDriver 验收插件绝不进入发布包，
# 构建后有专门的二进制扫描步骤把关（检出 wdio 特征字符串即红灯）。
# 产物：NSIS 安装包 + updater 产物（.nsis.zip 与 .sig）+ latest.json，
# 全部走 artifact 上传；GitHub Release 由发版流程在校验后统一创建。
# 触发：版本 tag（v*）或手动 dispatch。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 打包 NSIS 安装包（正式构建：无验收插件）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: 校验产物并生成 latest.json
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem "$dir/*.exe" | Where-Object { $_.Name -notlike '*.nsis.*' } | Select-Object -First 1
          $zip = Get-ChildItem "$dir/*.nsis.zip" | Select-Object -First 1
          $sig = Get-ChildItem "$dir/*.nsis.zip.sig" | Select-Object -First 1
          if (-not $exe) { throw 'NSIS 安装包未生成' }
          if (-not $zip -or -not $sig) { throw 'updater 产物（.nsis.zip / .sig）未生成' }
          "安装包：$($exe.Name)（$($exe.Length) 字节）"
          "更新包：$($zip.Name)（$($zip.Length) 字节）"

          # 红线校验：正式 exe 里不得含验收插件特征字符串
          $appExe = 'src-tauri/target/release/shiyin.exe'
          $bytes = [IO.File]::ReadAllBytes($appExe)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($mark in @('TAURI_WEBDRIVER_PORT', 'wdio-webdriver', 'wdio_webdriver')) {
            if ($ascii.Contains($mark)) { throw "正式包检出验收插件特征：$mark" }
          }
          '验收插件特征扫描：干净'

          # latest.json：应用内 updater 的检查清单，url 指向本次 Release 的更新包资产
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $latest = [ordered]@{
            version = $version
            notes = '见 GitHub Release 说明'
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url = "https://github.com/xiaoyu-hue/shiyin/releases/download/$tag/$($zip.Name)"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content "$dir/latest.json" -Encoding utf8
          "latest.json 已生成（version=$version, tag=$tag）"
          "nsis_dir=$dir" >> $env:GITHUB_ENV

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

name: windows-release

# Windows 桌面版正式发布构建（1.3.0 起）。
# 与验收构建（windows-acceptance.yml）的唯一差异：不带 ci-webdriver feature、
# 不加 tauri.ci.conf.json——内嵌 WebDriver 验收插件绝不进入发布包，
# 构建后有专门的二进制扫描步骤把关（检出 wdio 特征字符串即红灯）。
# 产物：NSIS 安装包 + updater 签名（.exe.sig，Tauri 2 的 v2 更新格式直接签安装包）+ latest.json，
# 全部走 artifact 上传；GitHub Release 由发版流程在校验后统一创建。
# 触发：版本 tag（v*）或手动 dispatch。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # 发布门禁（审计 A-06）：构建前先跑全量单测，红灯不打包
      - name: 单元测试门禁
        run: npm test

      # 版本一致性（审计 A-17/A-18）：锁文件与 Cargo 版本必须与 package.json 一致
      - name: 版本一致性校验（锁文件）
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(l.version!==p.version||l.packages[''].version!==p.version){console.error('package-lock.json 版本与 package.json 不一致');process.exit(1)}"

      - name: 版本一致性校验（Cargo）
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($cargo -ne $pkg) { Write-Error "Cargo.toml 版本 $cargo 与 package.json $pkg 不一致"; exit 1 }
          Write-Host "版本一致性 OK: $pkg"

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master（动作代码钉死，工具链仍取 stable）
        with:
          toolchain: stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 打包 NSIS 安装包（正式构建：无验收插件）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: 校验产物并生成 latest.json
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem "$dir/*.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$dir/*.exe.sig" | Select-Object -First 1
          if (-not $exe) { throw 'NSIS 安装包未生成' }
          if (-not $sig) { throw 'updater 签名（.exe.sig）未生成' }
          "安装包：$($exe.Name)（$($exe.Length) 字节）"
          "签名文件：$($sig.Name)"

          # 红线校验：正式 exe 里不得含验收插件特征字符串
          $appExe = 'src-tauri/target/release/shiyin.exe'
          $bytes = [IO.File]::ReadAllBytes($appExe)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($mark in @('TAURI_WEBDRIVER_PORT', 'wdio-webdriver', 'wdio_webdriver')) {
            if ($ascii.Contains($mark)) { throw "正式包检出验收插件特征：$mark" }
          }
          '验收插件特征扫描：干净'

          # latest.json：应用内 updater 的检查清单，url 指向本次 Release 的安装包资产
          #（Tauri 2 的 v2 更新格式：更新包就是安装包本体，签名在 .exe.sig）
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $latest = [ordered]@{
            version = $version
            notes = '见 GitHub Release 说明'
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url = "https://github.com/xiaoyu-hue/shiyin/releases/download/$tag/$($exe.Name)"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content "$dir/latest.json" -Encoding utf8
          "latest.json 已生成（version=$version, tag=$tag）"
          "nsis_dir=$dir" >> $env:GITHUB_ENV

      - name: 上传发布产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

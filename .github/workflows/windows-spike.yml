name: windows-spike

# Windows 阶段验证包（Spike）专用工作流。
# 在真实 Windows runner 上完成「打包 NSIS → 静默安装 → 自动化验收 → 卸载」全链，
# 产物（安装包 + 验收截图/报告）走 artifact 下载，不发 Release、不进主线。
# 触发方式：workflow_dispatch 要求工作流文件已在默认分支上（GitHub 限制），
# 验证包阶段文件只在 spike 分支，故同时挂 push 触发（仅限本分支）方便迭代；
# 正式版转正时删掉 push 触发、只留 dispatch/tag。
on:
  workflow_dispatch:
  push:
    branches:
      - spike/tauri-windows

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 打包 NSIS 安装包（Tauri build 会先跑 beforeBuildCommand 构建前端）
        run: npx tauri build --bundles nsis

      - name: 定位安装包
        id: inst
        shell: pwsh
        run: |
          $f = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $f) { throw 'NSIS 安装包未生成' }
          "installer=$($f.FullName)" >> $env:GITHUB_OUTPUT
          "安装包：$($f.FullName)（$($f.Length) 字节）"

      - name: 下载与 WebView2 版本匹配的 msedgedriver
        shell: pwsh
        run: |
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = $null
          foreach ($root in @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid"
          )) {
            try { $pv = (Get-ItemProperty $root -ErrorAction Stop).pv } catch { $pv = $null }
            if ($pv) { break }
          }
          if (-not $pv) { throw '注册表里找不到 WebView2 运行时版本' }
          "WebView2 运行时版本：$pv"
          $dir = Join-Path $env:RUNNER_TEMP 'driver'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver.zip'
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$pv/edgedriver_win64.zip" -OutFile $zip
          } catch {
            Invoke-WebRequest "https://msedgedriver.azureedge.net/$pv/edgedriver_win64.zip" -OutFile $zip
          }
          Expand-Archive $zip -DestinationPath $dir -Force
          $drv = Get-ChildItem $dir -Recurse -Filter msedgedriver.exe | Select-Object -First 1
          if (-not $drv) { throw 'msedgedriver 解压后未找到' }
          "MSEDGEDRIVER=$($drv.FullName)" >> $env:GITHUB_ENV

      - name: 尝试启动音频服务（无声卡 runner 上尽量提供播放设备）
        shell: pwsh
        continue-on-error: true
        run: |
          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue
          Get-Service Audiosrv, AudioEndpointBuilder | Format-Table Name, Status

      - name: 生成测试音频与 test-import.json 钩子
        shell: python
        run: |
          import json
          import math
          import os
          import struct
          import wave

          def make_wav(path, seconds, freq, rate=22050):
              w = wave.open(path, 'wb')
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)
              frames = b''.join(
                  struct.pack('<h', int(8000 * math.sin(2 * math.pi * freq * i / rate)))
                  for i in range(int(seconds * rate))
              )
              w.writeframes(frames)
              w.close()

          test_dir = os.path.join(os.environ['RUNNER_TEMP'], 'shiyin-test')
          os.makedirs(test_dir, exist_ok=True)
          short = os.path.join(test_dir, 'TestToneShort.wav')
          long = os.path.join(test_dir, 'TestToneLong.wav')
          make_wav(short, 4, 440.0)
          make_wav(long, 30, 660.0)

          app_data = os.path.join(os.environ['APPDATA'], 'com.shiyin.player')
          os.makedirs(app_data, exist_ok=True)
          hook = os.path.join(app_data, 'test-import.json')
          with open(hook, 'w', encoding='utf-8') as f:
              json.dump([short, long], f)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'HOOK_PATH={hook}\n')
          print('hook:', hook, [short, long])

      - name: 静默安装
        shell: pwsh
        run: |
          $p = Start-Process '${{ steps.inst.outputs.installer }}' -ArgumentList '/S' -Wait -PassThru
          "安装器退出码：$($p.ExitCode)"
          Start-Sleep -Seconds 3
          $exe = $null
          foreach ($root in @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )) {
            Get-ItemProperty $root -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'Shiyin*' } |
              ForEach-Object {
                # Tauri NSIS 写入的 InstallLocation 带引号，先剥掉再用
                $loc = $_.InstallLocation.Trim('"')
                "注册表命中：$($_.DisplayName) @ $loc"
                if ($loc -and (Test-Path $loc)) {
                  $c = Get-ChildItem $loc -Filter *.exe | Where-Object { $_.Name -ne 'uninstall.exe' } | Select-Object -First 1
                  if ($c) { $exe = $c.FullName }
                }
              }
            if ($exe) { break }
          }
          if (-not $exe) {
            # 兜底：Tauri NSIS 默认安装目录（当前用户 / 全机两种）
            foreach ($cand in @("$env:LOCALAPPDATA\Shiyin\shiyin.exe", "$env:ProgramFiles\Shiyin\shiyin.exe")) {
              if (Test-Path $cand) { $exe = $cand; break }
            }
          }
          if (-not $exe) { throw '注册表/安装目录里找不到已安装的诗音 exe' }
          "已安装 exe：$exe"
          "SHIYIN_EXE=$exe" >> $env:GITHUB_ENV
          "SHIYIN_PROC=$([IO.Path]::GetFileName($exe))" >> $env:GITHUB_ENV

      - name: 安装 pywinauto（托盘断言）
        run: pip install pywinauto psutil

      - name: 应用独立启动自检（诊断：不经 WebDriver 直接拉起）
        shell: pwsh
        continue-on-error: true
        run: |
          python e2e/launch_check.py
          New-Item -ItemType Directory -Force 'e2e/artifacts' | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$pwd\e2e\artifacts\00-standalone.png")
          taskkill /IM $env:SHIYIN_PROC /F 2>$null; Start-Sleep -Seconds 2

      - name: 自动化验收（WebdriverIO + tauri-driver）
        working-directory: e2e
        env:
          SHORT_NAME: TestToneShort
          LONG_NAME: TestToneLong
        run: |
          npm ci
          node run.mjs

      - name: 静默卸载
        if: always()
        shell: pwsh
        run: |
          $un = $null
          foreach ($root in @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )) {
            Get-ItemProperty $root -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'Shiyin*' } |
              ForEach-Object {
                $loc = $_.InstallLocation.Trim('"')
                if ($loc) {
                  $c = Join-Path $loc 'uninstall.exe'
                  if (Test-Path $c) { $un = $c }
                }
              }
            if ($un) { break }
          }
          if ($un) {
            $p = Start-Process $un -ArgumentList '/S' -Wait -PassThru
            "卸载器退出码：$($p.ExitCode)"
            Start-Sleep -Seconds 2
          } else {
            '未找到卸载器（可能安装未成功），跳过'
          }

      - name: 上传产物（安装包 + 验收截图与报告）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-spike-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            e2e/artifacts/**
          if-no-files-found: warn

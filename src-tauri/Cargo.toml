[package]
name = "shiyin"
version = "1.2.1"
description = "诗音 Shiyin - 本地音乐播放器（桌面端）"
authors = ["xiaoyu-hue"]
edition = "2021"

# 桌面壳本体：界面与业务逻辑全在前端（与网页/安卓共用），
# Rust 侧只做窗口/托盘/单实例与文件桥，见 src/lib.rs。
[lib]
name = "shiyin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 锁 Tauri 2.12.x 线（~ 限定次版本内），与 @tauri-apps/cli / api 的 2.12.x 对齐
tauri = { version = "~2.12", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# 验证包专用：WebdriverIO 内嵌 WebDriver 服务器（CI 自动化验收用）。
# 仅当应用启动环境带 TAURI_WEBDRIVER_PORT 时才激活监听，普通启动不带此变量、无对外服务。
# 正式版必须移除本依赖或以 feature 开关隔离，不得随正式安装包发布。
tauri-plugin-wdio-webdriver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

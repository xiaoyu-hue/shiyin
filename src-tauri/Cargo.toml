[package]
name = "shiyin"
version = "1.4.1"
description = "诗音 Shiyin - 本地音乐播放器（桌面端）"
authors = ["xiaoyu-hue"]
edition = "2021"

# 桌面壳本体：界面与业务逻辑全在前端（与网页/安卓共用），
# Rust 侧只做窗口/托盘/单实例、文件桥与更新/自启插件注册，见 src/lib.rs。
[lib]
name = "shiyin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# CI 自动化验收专用：内嵌 WebDriver 服务器（tauri-plugin-wdio-webdriver）。
# 默认关闭——正式发布构建不带此 feature，二进制里没有该插件、capability
# 也不含其权限（见 tauri.conf.json 的 capabilities 显式名单与 tauri.ci.conf.json）。
# 仅 CI 验收构建以 `--features ci-webdriver` + `--config tauri.ci.conf.json` 启用。
ci-webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
# 锁 Tauri 2.12.x 线（~ 限定次版本内），与 @tauri-apps/cli / api 的 2.12.x 对齐
tauri = { version = "~2.12", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# 自动更新（官方 updater + process 重启）：签名走 minisign，
# 私钥只存 GitHub Secrets 与用户保管的原件，绝不入仓（见 tauri.conf.json 的 pubkey 注释）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 开机自启（官方插件，Windows 走注册表 Run 项）；设置页开关默认关
tauri-plugin-autostart = "2"
# CI 验收专用插件（可选依赖，仅 ci-webdriver feature 启用，正式包不含）
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
